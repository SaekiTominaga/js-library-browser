<!doctype html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>`form-control-validation` Demo</title>
		<style>
			input,
			select,
			textarea {
				border: 1px solid;
				padding: 0.5em;
			}

			[role='radiogroup' i] {
				display: inline flow-root;
				border: 1px solid transparent;
				padding-block: 0.25em;
			}

			:where(input, select, textarea):user-invalid,
			[role='radiogroup' i]:has(input[type='radio' i]:user-invalid) {
				border-color: #e00;
			}

			button {
				padding: 0.5em;
			}

			.form-layout {
				display: block grid;
				grid-template-columns: auto 1fr;
				gap: 1em;

				& .fieldset {
					display: block grid;
					grid-template-columns: subgrid;
					grid-column: 1/3;
				}

				& .legend {
					padding-block: 0.25em;
				}
			}

			.validation {
				margin: 0.25em 0 0;
				background-color: #fff;
				color: #e00;

				&::before {
					margin-inline-end: 0.25em;
					content: '⚠';
				}
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"@w0s/form-control-validation": "../dist/index.js"
				}
			}
		</script>
		<script type="module">
			import formControlValidation from '@w0s/form-control-validation';

			formControlValidation(document.querySelectorAll('.js-form-control-validation'));
		</script>
	</head>
	<body>
		<h1><code>form-control-validation</code> Demo</h1>

		<form method="post">
			<div class="form-layout">
				<div class="fieldset">
					<span class="legend"><label for="input-tel">Telephone number (required)</label></span>
					<div class="contents">
						<input
							type="tel"
							class="js-form-control-validation"
							id="input-tel"
							required=""
							pattern="[0-9\-]+"
							aria-errormessage="validation-tel"
							title="Phone numbers is numbers and hyphens only."
						/>
						<p hidden="" class="validation" id="validation-tel"></p>
					</div>
				</div>
				<div class="fieldset">
					<span class="legend" id="label-sex">Sex (required)</span>
					<div class="contents">
						<div role="radiogroup" class="js-form-control-validation" aria-errormessage="validation-sex" aria-labelledby="label-sex">
							<label><input type="radio" name="sex" required="" />Male</label>
							<label><input type="radio" name="sex" required="" />Female</label>
							<label><input type="radio" name="sex" required="" />Neither</label>
						</div>
						<p hidden="" class="validation" id="validation-sex"></p>
					</div>
				</div>
				<div class="fieldset">
					<span class="legend"><label for="select-sex">Age (required)</label></span>
					<div class="contents">
						<select class="js-form-control-validation" id="select-sex" required="" aria-errormessage="validation-sex2">
							<option label="Please select"></option>
							<option>0–9</option>
							<option>10–19</option>
							<option>20–29</option>
							<option>30–39</option>
							<option>40–49</option>
							<option>50–59</option>
							<option>60–69</option>
							<option>70–79</option>
							<option>80–89</option>
							<option>90–99</option>
							<option>100–</option>
						</select>
						<p hidden="" class="validation" id="validation-sex2"></p>
					</div>
				</div>
				<div class="fieldset">
					<span class="legend"><label for="textarea-message">Message (required)</label></span>
					<div class="contents">
						<textarea class="js-form-control-validation" id="textarea-message" required="" aria-errormessage="validation-message"></textarea>
						<p hidden="" class="validation" id="validation-message"></p>
					</div>
				</div>
			</div>
			<p><button>Submit</button></p>
		</form>
	</body>
</html>
