name: Release to npm

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - run: |
          git fetch origin main
          git checkout main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'latest'
          registry-url: 'https://registry.npmjs.org/'

      - run: npm ci

      - name: Version
        id: extract
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          package="${tag%@*}"
          version="${tag##*@}"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          npm run build -w @w0s/writing-mode
          npm run build -w ${{ steps.extract.outputs.package }}

      - name: Version
        run: npm version ${{ steps.extract.outputs.version }} -w ${{ steps.extract.outputs.package }} --no-git-tag-version

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git add .
          git commit -am "chore: release ${{ steps.extract.outputs.package }}@${{ steps.extract.outputs.version }}"
          git push

      - name: Publish
        run: npm publish --provenance -w ${{ steps.extract.outputs.package }}
